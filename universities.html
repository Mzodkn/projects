<body class="bg-[#0a1a2f] bg-gradient-to-b from-[#0a1a2f] to-[#1f1f1f] bg-fixed text-gray-100 min-h-screen flex flex-col items-center justify-start pt-16 p-2">

    <nav id="navbar" class="fixed top-6 left-6 right-6 max-w-6xl mx-auto z-50 bg-[#020024]/80 border border-gray-800 p-4 rounded-2xl shadow-xl backdrop-blur-xl flex justify-between items-center transition-all duration-300 transform translate-y-0">
        
        <div class="flex items-center gap-4 relative">
            
            <button id="menuBtn" onclick="toggleMenu()" class="p-2.5 bg-gray-900/60 border border-gray-700 rounded-xl text-white hover:bg-gray-800 transition shadow-lg">

            </button>


<div id="dropdownMenu" class="absolute top-16 right-0 mt-2 w-64 bg-[#020024]/90 backdrop-blur-xl border border-gray-700 rounded-2xl shadow-2xl opacity-0 invisible transition-all duration-300 transform scale-95 origin-top-right">

                <a href="scholars.html" class="menu-link block px-4 py-3 rounded-xl transition-all">

        <a href="saved.html" class="menu-link block px-4 py-3 rounded-xl transition-all">

        </a>
        <a href="stats.html" class="menu-link block px-4 py-3 rounded-xl transition-all">

        <a href="about.html" class="menu-link block px-4 py-3 rounded-xl transition-all">

</div>

        </div>
        
        <div class="flex items-center gap-2 sm:gap-3">
        <p class="text-xs sm:text-sm text-gray-400 font-medium text-center sm:text-right">
                ⚠️ <span class="text-gray-300">تنبيه:</span> تأكد  من مراجعة التخصصات مع دليل القبول قبل التقديم النهائي.
            </p>
            <a href="universities.html" class="px-4 py-2 bg-blue-600/20 border border-blue-500/30 text-white rounded-xl font-bold transition text-sm">
                ارجع فوق
            </a>
        </div>
    </nav>

    <main class="max-w-6xl w-full mx-auto mt-24 p-4 grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <aside class="md:col-span-1 bg-[#020024]/80 p-6 rounded-3xl shadow-xl border border-gray-800 backdrop-blur-xl h-fit">
            <h2 class="text-xl font-bold mb-4 border-b border-gray-800 pb-2 text-blue-300">إعدادات البحث</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1 text-gray-300">نسبتك المئوية</label>
                <input type="number" id="percentage" step="0.1" min="50" max="100" placeholder="مثال: 85.5" class="w-full bg-[#0a1a2f] border border-gray-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1 text-gray-300">الجامعة</label>
                <select id="university" class="w-full bg-[#0a1a2f] border border-gray-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">كل الجامعات</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1 text-gray-300">المنطقة / الولاية</label>
                <select id="region" class="w-full bg-[#0a1a2f] border border-gray-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">كل المناطق</option>
                    <option value="الخرطوم">الخرطوم</option>
                    <option value="الجزيرة">الجزيرة</option>
                    <option value="نهر النيل">نهر النيل</option>
                    <option value="الشمالية">الشمالية</option>
                    <option value="البحر الأحمر">البحر الأحمر</option>
                    <option value="كسلا">كسلا</option>
                    <option value="القضارف">القضارف</option>
                    <option value="سنار">سنار</option>
                    <option value="النيل الأزرق">النيل الأزرق</option>
                    <option value="النيل الأبيض">النيل الأبيض</option>
                    <option value="شمال كردفان">شمال كردفان</option>
                    <option value="جنوب كردفان">جنوب كردفان</option>
                    <option value="غرب كردفان">غرب كردفان</option>
                    <option value="شمال دارفور">شمال دارفور</option>
                    <option value="جنوب دارفور">جنوب دارفور</option>
                    <option value="وسط دارفور">وسط دارفور</option>
                    <option value="غرب دارفور">غرب دارفور</option>
                    <option value="شرق دارفور">شرق دارفور</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1 text-gray-300">نوع التقديم</label>
                <select id="admission_type" class="w-full bg-[#0a1a2f] border border-gray-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">الكل</option>
                    <option selected value="عام">عام</option>
                    <option value="ولائي">ولائي</option>
                    <option value="شهادات أجنبية">شهادات أجنبية</option>
                    <option value="مغتربين - السعودية">مغتربين - السعودية</option>
                    <option value="مغتربين - الإمارات">مغتربين - الإمارات</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium mb-1 text-gray-300">القسم / المجال</label>
                <select id="category" class="w-full bg-[#0a1a2f] border border-gray-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">الكل</option>
                    <option value="طب وصحة">طب وصحة</option>
                    <option value="هندسة وعمارة">هندسة وعمارة</option>
                    <option value="كمبيوتر وتقنية">كمبيوتر وتقنية</option>
                    <option value="علوم إدارية واقتصادية">علوم إدارية واقتصادية</option>
                    <option value="علوم زراعية وبيطرية">علوم زراعية وبيطرية</option>
                    <option value="علوم وتكنولوجيا بحتة">علوم وتكنولوجيا بحتة</option>
                    <option value="علوم إنسانية وتربية ولغات">الشريعة ,علوم إنسانية وتربية ولغات</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1 text-gray-300">ابحث باسم التخصص</label>
                <input type="text" id="program_search" placeholder="مثال: طب، هندسة، تقنية..." class="w-full bg-[#0a1a2f] border border-gray-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <button onclick="resetAndFetch()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                ابحث الآن
            </button>
            <a href="دليل.pdf" download target="_blank" class="flex items-center justify-center gap-2 w-full mt-3 py-2 bg-gray-800/50 hover:bg-gray-700 border border-gray-700 text-gray-400 hover:text-white text-sm rounded-xl transition-all shadow-sm">
    📥 تحميل دليل القبول (PDF)
</a>
        </aside>

        <section class="md:col-span-3">
            <h2 id="results-title" class="text-2xl font-bold mb-4  text-blue-300"></h2>
            
            <div id="loading" class="hidden text-center text-blue-400 font-bold my-8">
            </div>

            <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            </div>

            <div id="load-more-container" class="text-center mt-6 hidden">
                <button onclick="loadMore()" class="px-6 py-3 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-blue-300 font-bold rounded-2xl shadow-xl transition">
                    عرض المزيد ⬇️
                </button>
            </div>
            
            <div id="no-results" class="hidden text-center text-gray-400 bg-[#020024]/80 p-8 rounded-3xl shadow-xl border border-gray-800 backdrop-blur-xl mt-4">
                لا توجد تخصصات تتطابق مع بحثك. جرب عدل الفلاتر.
            </div>
        </section>

    </main>

  <script src="uni.js"></script>
</body>
</html>
