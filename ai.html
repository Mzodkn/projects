<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل القبول الجامعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body class="bg-[#0a1a2f] bg-gradient-to-b from-[#0a1a2f] to-[#1f1f1f] bg-fixed text-gray-100 min-h-screen flex flex-col items-center justify-start pt-16 p-2">

    <!-- شريط التنقل العلوي مع زر القائمة المنسدلة -->
    <nav class="fixed top-6 left-6 right-6 max-w-6xl mx-auto z-50 bg-[#020024]/80 border border-gray-800 p-4 rounded-2xl shadow-xl backdrop-blur-xl flex justify-between items-center">
        <span class="text-blue-400 font-bold text-sm">🇸🇩 دليل القبول السوداني</span>
        
        <div class="flex items-center gap-3">
            <a href="univerities.html" class="px-4 py-2 bg-blue-600/20 border border-blue-500/30 text-white rounded-xl font-bold hover:bg-blue-600/40 transition text-sm">
                الرئيسية
            </a>
            
            <!-- زر القائمة المنسدلة -->
            <div class="relative">
                <button id="menuBtn" onclick="toggleMenu()" class="p-2.5 bg-gray-900/60 border border-gray-700 rounded-xl backdrop-blur-md text-white hover:bg-gray-800 transition-all shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                
                <!-- محتوى القائمة المنسدلة -->
                <div id="dropdownMenu" class="absolute top-12 left-0 mt-2 w-64 bg-[#020024]/90 backdrop-blur-xl border border-gray-700 rounded-2xl shadow-2xl opacity-0 invisible transition-all duration-300 transform scale-95 origin-top-left z-50">
                    <div class="p-3 space-y-2">
                        <a href="univerities.html" class="block px-4 py-3 text-white bg-blue-600/20 border border-blue-500/30 rounded-xl font-bold transition-all">
                            🏠 الرئيسية
                        </a>
                        <a href="ai.html" class="block px-4 py-3 text-gray-300 hover:text-white hover:bg-gray-800/50 rounded-xl transition-all font-medium">
                            🎯 دليل القبول والبحث
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl w-full mx-auto mt-24 p-4 grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <!-- لوحة الفلاتر -->
        <aside class="md:col-span-1 bg-[#020024]/80 p-6 rounded-3xl shadow-xl border border-gray-800 backdrop-blur-xl h-fit">
            <h2 class="text-xl font-bold mb-4 border-b border-gray-800 pb-2 text-blue-300">إعدادات البحث</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1 text-gray-300">نسبتك المئوية</label>
                <input type="number" id="percentage" step="0.1" min="50" max="100" placeholder="مثال: 85.5" class="w-full bg-[#0a1a2f] border border-gray-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- فلتر الجامعات -->
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1 text-gray-300">الجامعة</label>
                <select id="university" class="w-full bg-[#0a1a2f] border border-gray-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">كل الجامعات</option>
                </select>
            </div>

            <!-- فلتر المنطقة / المدينة -->
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1 text-gray-300">المنطقة / الولاية</label>
                <select id="region" class="w-full bg-[#0a1a2f] border border-gray-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">كل المناطق</option>
                    <option value="الخرطوم">الخرطوم</option>
                    <option value="الجزيرة">الجزيرة</option>
                    <option value="نهر النيل">نهر النيل</option>
                    <option value="الشمالية">الشمالية</option>
                    <option value="البحر الأحمر">البحر الأحمر</option>
                    <option value="كسلا">كسلا</option>
                    <option value="القضارف">القضارف</option>
                    <option value="سنار">سنار</option>
                    <option value="النيل الأزرق">النيل الأزرق</option>
                    <option value="النيل الأبيض">النيل الأبيض</option>
                    <option value="شمال كردفان">شمال كردفان</option>
                    <option value="جنوب كردفان">جنوب كردفان</option>
                    <option value="غرب كردفان">غرب كردفان</option>
                    <option value="شمال دارفور">شمال دارفور</option>
                    <option value="جنوب دارفور">جنوب دارفور</option>
                    <option value="وسط دارفور">وسط دارفور</option>
                    <option value="غرب دارفور">غرب دارفور</option>
                    <option value="شرق دارفور">شرق دارفور</option>
                </select>
            </div>

            <!-- نوع التقديم -->
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1 text-gray-300">نوع التقديم</label>
                <select id="admission_type" class="w-full bg-[#0a1a2f] border border-gray-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">الكل</option>
                    <option value="عام">عام</option>
                    <option value="ولائي">ولائي</option>
                    <option value="شهادات أجنبية">شهادات أجنبية</option>
                    <option value="مغتربين - السعودية">مغتربين - السعودية</option>
                    <option value="مغتربين - الإمارات">مغتربين - الإمارات</option>
                </select>
            </div>

            <!-- القسم -->
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1 text-gray-300">القسم / المجال</label>
                <select id="category" class="w-full bg-[#0a1a2f] border border-gray-700 rounded-xl p-2 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">الكل</option>
                    <option value="طب وصحة">طب وصحة</option>
                    <option value="هندسة وعمارة">هندسة وعمارة</option>
                    <option value="كمبيوتر وتقنية">كمبيوتر وتقنية</option>
                    <option value="علوم إدارية واقتصادية">علوم إدارية واقتصادية</option>
                    <option value="علوم زراعية وبيطرية">علوم زراعية وبيطرية</option>
                    <option value="علوم وتكنولوجيا بحتة">علوم وتكنولوجيا بحتة</option>
                    <option value="علوم إنسانية وتربية ولغات">علوم إنسانية وتربية ولغات</option>
                </select>
            </div>

            <button onclick="resetAndFetch()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                ابحث الآن
            </button>
        </aside>

        <!-- منطقة عرض النتائج -->
        <section class="md:col-span-3">
            <h2 class="text-2xl font-bold mb-4 text-blue-300">النتائج المطابقة</h2>
            
            <div id="loading" class="hidden text-center text-blue-400 font-bold my-8">
                جاري جلب البيانات...
            </div>

            <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- النتائج -->
            </div>

            <!-- زر عرض المزيد -->
            <div id="load-more-container" class="text-center mt-6 hidden">
                <button onclick="loadMore()" class="px-6 py-3 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-blue-300 font-bold rounded-2xl shadow-xl transition">
                    عرض المزيد ⬇️
                </button>
            </div>
            
            <div id="no-results" class="hidden text-center text-gray-400 bg-[#020024]/80 p-8 rounded-3xl shadow-xl border border-gray-800 backdrop-blur-xl mt-4">
                لا توجد تخصصات تتطابق مع بحثك. جرب تعديل الفلاتر.
            </div>
        </section>

    </main>

    <script>
        const SUPABASE_URL = 'https://wxalmjkwstlstzktnuyz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4YWxtamt3c3Rsc3R6a3RudXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNTMwMTcsImV4cCI6MjEwNDgyOTAxN30.Dr_W7B0hI9VuvlAUHHUiw_UP9gKAHttOB6Wq5cxIoG8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const universitiesList = [
            "جامعة الخرطوم", "جامعة أم درمان الاسلامية", "جامعة السودان للعلوم والتكنولوجيا",
            "جامعة الجزيرة", "جامعة البطانة", "جامعة القرآن الكريم والعلوم الإسلامية",
            "جامعة القرآن الكريم وتأصيل العلوم", "جامعة النيلين", "جامعة الزعيم الأزهري",
            "جامعة بحري", "جامعة شندي", "جامعة وادي النيل", "جامعة دنقلا",
            "جامعة البحر الاحمر", "جامعة كسلا", "جامعة القضارف", "جامعة سنار",
            "جامعة النيل الأزرق", "جامعة الإمام المهدي", "جامعة بخت الرضا",
            "جامعة كردفان", "جامعة الدلنج", "جامعة غرب كردفان", "جامعة السلام",
            "جامعة الفاشر", "جامعة نيالا", "جامعة زالنجي", "جامعة الجنينة",
            "جامعة عبداللطيف الحمد التكنولوجية", "جامعة الضعين", "جامعة السودان التقانية",
            "جامعة المناقل للعلوم والتكنولوجيا", "جامعة شرق كردفان",
            "الجامعة التكنولوجية - الخرطوم", "جامعة العلوم الصحية – الخرطوم"
        ];

        let currentLimit = 40;

        window.addEventListener('DOMContentLoaded', () => {
            populateUniversities();
            fetchResults();
        });

        // دالة التحكم في إظهار وإخفاء القائمة المنسدلة
        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('opacity-0');
            menu.classList.toggle('invisible');
            menu.classList.toggle('scale-95');
            menu.classList.toggle('scale-100');
        }

        // إغلاق القائمة عند النقر خارجها
        window.addEventListener('click', function(e) {
            const menu = document.getElementById('dropdownMenu');
            const btn = document.getElementById('menuBtn');
            if (!menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.add('opacity-0', 'invisible', 'scale-95');
                menu.classList.remove('scale-100');
            }
        });

        function populateUniversities() {
            const selectUni = document.getElementById('university');
            universitiesList.sort().forEach(uni => {
                const option = document.createElement('option');
                option.value = uni;
                option.textContent = uni;
                selectUni.appendChild(option);
            });
        }

        function resetAndFetch() {
            currentLimit = 40;
            fetchResults();
        }

        function loadMore() {
            currentLimit += 40;
            fetchResults(true);
        }

        async function fetchResults(isAppending = false) {
            const percentage = document.getElementById('percentage').value;
            const university = document.getElementById('university').value;
            const region = document.getElementById('region').value;
            const admissionType = document.getElementById('admission_type').value || 'عام';

            const category = document.getElementById('category').value;

            const grid = document.getElementById('results-grid');
            const noResults = document.getElementById('no-results');
            const loading = document.getElementById('loading');
            const loadMoreContainer = document.getElementById('load-more-container');

            if (!isAppending) {
                grid.innerHTML = '';
            }
            noResults.classList.add('hidden');
            loading.classList.remove('hidden');

            let query = supabaseClient.from('univ').select('*', { count: 'exact' });

            if (percentage) {
                query = query.lte('percentage', parseFloat(percentage));
            }
            if (university) {
                query = query.ilike('university', `%${university}%`);
            }
            if (region) {
                query = query.eq('region', region);
            }
            if (admissionType) {
                query = query.eq('admission_type', admissionType);
            }
            if (category) {
                query = query.eq('category', category);
            }

            query = query.order('percentage', { ascending: false });
            query = query.range(isAppending ? currentLimit - 40 : 0, currentLimit - 1);

            const { data, count, error } = await query;

            loading.classList.add('hidden');

            if (error) {
                console.error("Error fetching data:", error);
                return;
            }

            if (!isAppending && data.length === 0) {
                noResults.classList.remove('hidden');
                loadMoreContainer.classList.add('hidden');
                return;
            }

            if (currentLimit < count) {
                loadMoreContainer.classList.remove('hidden');
            } else {
                loadMoreContainer.classList.add('hidden');
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-[#020024]/80 p-5 rounded-3xl shadow-xl border border-gray-800 backdrop-blur-xl hover:border-blue-500/50 transition flex flex-col justify-between";
                
                let genderBadgeColor = "bg-gray-800 text-gray-300 border border-gray-700";
                if (item.gender === "طالبات فقط") genderBadgeColor = "bg-pink-950/50 text-pink-300 border border-pink-800/50";
                if (item.gender === "طلاب فقط") genderBadgeColor = "bg-blue-950/50 text-blue-300 border border-blue-800/50";

                const regionText = item.region ? `📍 ${item.region}` : '';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="inline-block px-3 py-1 text-xs font-bold bg-blue-600/20 text-blue-300 border border-blue-500/30 rounded-full">${item.category}</span>
                            <span class="inline-block px-2.5 py-0.5 text-xs font-semibold bg-emerald-950/50 text-emerald-300 border border-emerald-800/50 rounded-lg">${item.admission_type}</span>
                        </div>
                        <h3 class="text-lg font-bold text-white leading-tight mb-1">${item.program}</h3>
                        <p class="text-sm text-gray-300 font-medium">${item.university}</p>
                        <p class="text-xs text-gray-400 mb-4">${regionText}</p>
                    </div>
                    <div class="border-t border-gray-800 pt-3 flex justify-between items-center">
                        <div class="text-center">
                            <span class="block text-xs text-gray-400">النسبة المطلوبة</span>
                            <span class="font-bold text-green-400 text-lg">%${item.percentage}</span>
                        </div>
                        <div class="text-center">
                            <span class="block text-xs text-gray-400">الفئة</span>
                            <span class="inline-block px-2.5 py-1 text-xs font-bold ${genderBadgeColor} rounded-xl mt-1">${item.gender}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
